---
- name: Verify Kubernetes cluster
  hosts: k8s_master
  become: true

  tasks:

    - name: Check kubelet service
      command: systemctl is-active kubelet
      register: kubelet_status
      changed_when: false

    - name: Show kubelet status
      debug:
        msg: "Kubelet status: {{ kubelet_status.stdout }}"

    - name: Check Kubernetes nodes
      command: kubectl get nodes
      register: kubernetes_nodes
      changed_when: false
      become_user: ubuntu

    - name: Show Kubernetes nodes
      debug:
        msg: "{{ kubernetes_nodes.stdout }}"
